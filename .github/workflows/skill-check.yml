name: skill-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Run skill validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run validate_skill.py
        run: python scripts/validate_skill.py --json

      - name: Run validate_skill regression tests
        run: python -m unittest tests.test_validate_skill -v
